# OntoAir — nginx location block for the public web service.
#
# This is the reference copy of the /ontoair locations that live inside the
# `poc.aifactory.space` server block in /etc/nginx/sites-available/Poc on the
# POC host (13.209.206.4). Paste these inside that server { ... } block.
#
# Deployment facts (see DEPLOY.md):
#   - TLS is terminated at the upstream load balancer; DNS for
#     poc.aifactory.space -> 52.78.5.37 / 15.165.66.29, which proxy ALL paths
#     for this Host to the POC box over plain HTTP. So this box only serves
#     HTTP; the service is reachable at https://poc.aifactory.space/ontoair.
#   - `absolute_redirect off` keeps redirects on the original https scheme
#     (without it nginx would emit http:// Location headers, since $scheme is
#     http behind the proxy).
#   - Webroot /home/ubuntu/poc/ontoair/web is generated by scripts/build-web.sh.

location = /ontoair {
    absolute_redirect off;   # keep https scheme (TLS terminates upstream)
    return 302 /ontoair/;
}
location /ontoair/ {
    alias /home/ubuntu/poc/ontoair/web/;
    absolute_redirect off;   # keep https on auto trailing-slash redirects
    index index.html;
    charset utf-8;

    # Powers the in-app sample browser: it parses an HTML directory
    # listing of test/ subfolders.
    autoindex on;
    autoindex_exact_size off;
}
