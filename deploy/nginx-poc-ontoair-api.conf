# OntoAir chat backend proxy — add inside the poc.aifactory.space server block,
# BEFORE the `location /ontoair/` block. The trailing slash on proxy_pass strips
# the /ontoair/api/ prefix so the backend (server/ontoair-chat-server.js on :8790)
# sees /chat. Backend runs via systemd: deploy/ontoair-chat.service.
location /ontoair/api/ {
    proxy_pass         http://127.0.0.1:8790/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;   # LLM calls (incl. full-TTL edits) can be slow
    proxy_send_timeout 180s;
}
